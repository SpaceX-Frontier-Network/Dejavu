<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏆 Champions Chat · Premium</title>

    <!-- ===== FONTS & STYLES ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <style>
        /* ---------- RESET & BASE ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #141b2b;
            --bg-card: #1a2333;
            --bg-input: #1e2a3d;
            --text-primary: #f0f4ff;
            --text-secondary: #9aabcc;
            --text-muted: #5d7299;
            --accent: #3b82f6;
            --accent-hover: #6090f7;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --border-color: #2a3a55;
            --shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            --radius: 24px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            scroll-behavior: smooth;
        }

        /* custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover);
        }

        /* ============================================================
                   LOGIN / SLIDESHOW PAGE
                   ============================================================ */
        #loginPage {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            transition: opacity 0.9s ease, visibility 0.9s ease;
        }

        #loginPage.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ---------- SLIDESHOW ---------- */
        .slideshow {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 0;
        }

        .slide.active {
            opacity: 1;
            z-index: 1;
        }

        .slide-bg {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transform: scale(1);
            transition: transform 8s ease-in-out;
            will-change: transform;
        }

        .slide.active .slide-bg {
            transform: scale(1.08);
        }

        .slide::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                    rgba(0, 0, 0, 0.75) 0%,
                    rgba(0, 0, 0, 0.4) 50%,
                    rgba(0, 0, 0, 0.75) 100%);
            z-index: 2;
        }

        .slide-content {
            position: absolute;
            bottom: 15%;
            left: 10%;
            z-index: 3;
            max-width: 600px;
            text-shadow: 0 4px 40px rgba(0, 0, 0, 0.9);
        }

        .slide-content .player-name {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .slide-content .player-quote {
            font-size: clamp(1rem, 1.5vw, 1.4rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1px;
            -webkit-text-fill-color: #fff;
            border-left: 3px solid var(--accent);
            padding-left: 16px;
        }

        /* slide indicators */
        .slide-indicators {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 12px;
            pointer-events: none;
        }

        .slide-indicators .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: var(--transition);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slide-indicators .dot.active {
            background: #fff;
            width: 28px;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* ---------- LOGIN CARD ---------- */
        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(20, 26, 34, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 48px 40px 40px;
            max-width: 420px;
            width: 92%;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            animation: card-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card .logo {
            font-size: 48px;
            margin-bottom: 8px;
            display: block;
            line-height: 1;
        }

        .login-card h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .login-card h1 span {
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-card .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .input-group .input-wrap {
            display: flex;
            align-items: center;
            background: rgba(30, 42, 61, 0.6);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .input-group .input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 14px 16px;
            font-size: 16px;
            color: var(--text-primary);
            font-family: var(--font);
            letter-spacing: 0.3px;
            font-weight: 400;
        }

        .input-group input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
        }

        .input-group .toggle-vis {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0 16px;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
            line-height: 1;
        }

        .input-group .toggle-vis:hover {
            color: var(--text-secondary);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.35);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .login-btn.loading .spinner {
            display: inline-block;
        }
        .login-btn.loading .btn-text {
            opacity: 0.7;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-msg {
            color: #fc5c7d;
            font-size: 13px;
            margin-top: 12px;
            min-height: 20px;
            font-weight: 400;
            transition: var(--transition);
            opacity: 0;
            transform: translateY(-6px);
        }

        .error-msg.show {
            opacity: 1;
            transform: translateY(0);
        }

        .login-footer {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 18px;
            display: flex;
            justify-content: center;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .login-footer .hint {
            color: var(--text-secondary);
            background: rgba(59, 130, 246, 0.10);
            padding: 4px 16px;
            border-radius: 20px;
            font-family: 'Inter', monospace;
            font-size: 13px;
            border: 1px solid rgba(59, 130, 246, 0.15);
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        /* ============================================================
                   CHAT APP
                   ============================================================ */
        #chatApp {
            display: none;
            height: 100vh;
            width: 100vw;
            background: var(--bg-primary);
            opacity: 0;
            transition: opacity 0.6s ease;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #chatApp.visible {
            display: flex;
            opacity: 1;
        }

        .chat-container {
            width: 100%;
            max-width: 960px;
            height: 100%;
            max-height: 820px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            background: rgba(20, 27, 43, 0.85);
        }

        /* ---------- CHAT HEADER ---------- */
        .chat-header {
            padding: 16px 24px;
            background: rgba(26, 35, 51, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .logo {
            font-size: 22px;
            line-height: 1;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .chat-header h1 span {
            color: var(--accent);
        }

        .chat-header .badge {
            font-size: 10px;
            background: #4cdf8b;
            color: #000;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .user-controls .username-display {
            font-size: 13px;
            color: var(--text-secondary);
            background: rgba(30, 42, 61, 0.5);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .user-controls .username-display:hover {
            border-color: var(--accent);
            background: rgba(30, 42, 61, 0.8);
        }

        .user-controls .username-display .edit-icon {
            font-size: 12px;
            opacity: 0.5;
            transition: var(--transition);
        }
        .user-controls .username-display:hover .edit-icon {
            opacity: 1;
        }

        .online-count {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(30, 42, 61, 0.5);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .online-count .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4cdf8b;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .logout-btn:hover {
            background: rgba(252, 92, 125, 0.12);
            border-color: #fc5c7d;
            color: #fc5c7d;
        }

        /* ---------- MESSAGES AREA ---------- */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 24px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: transparent;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            animation: fade-up 0.25s ease;
            margin-bottom: 2px;
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message {
            max-width: 72%;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message .msg-sender {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 2px;
            display: block;
        }

        .message .msg-text {
            display: block;
        }

        .message .msg-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
            text-align: right;
            opacity: 0.7;
        }

        /* own messages (right) */
        .message-wrapper.own {
            align-items: flex-end;
        }
        .message-wrapper.own .message {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message-wrapper.own .message .msg-sender {
            color: rgba(255, 255, 255, 0.7);
        }
        .message-wrapper.own .message .msg-time {
            color: rgba(255, 255, 255, 0.6);
        }

        /* others' messages (left) */
        .message-wrapper.other {
            align-items: flex-start;
        }
        .message-wrapper.other .message {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }
        .message-wrapper.other .message .msg-sender {
            color: var(--accent);
        }

        /* system messages */
        .message-wrapper.system {
            align-items: center;
        }
        .message-wrapper.system .message {
            background: rgba(30, 42, 61, 0.5);
            color: var(--text-secondary);
            font-size: 13px;
            padding: 6px 20px;
            border-radius: 20px;
            max-width: 80%;
            text-align: center;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(4px);
        }
        .message-wrapper.system .message .msg-sender {
            display: none;
        }
        .message-wrapper.system .message .msg-time {
            display: none;
        }

        /* typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 400;
            animation: fade-up 0.3s ease;
        }

        .typing-indicator .dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            margin: 0 2px;
            animation: typing-bounce 1.4s infinite ease-in-out;
        }
        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing-bounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-6px);
            }
        }

        /* empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
            gap: 8px;
            padding: 20px;
        }
        .empty-state .big-icon {
            font-size: 56px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 20px;
        }
        .empty-state p {
            font-size: 14px;
            max-width: 300px;
            opacity: 0.7;
        }

        /* ---------- INPUT AREA ---------- */
        .input-area {
            padding: 16px 24px 20px;
            background: rgba(20, 27, 43, 0.6);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .input-area .input-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(30, 42, 61, 0.4);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .input-area .input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .input-area textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: var(--font);
            padding: 12px 16px;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            line-height: 1.5;
            font-weight: 400;
        }
        .input-area textarea::placeholder {
            color: var(--text-muted);
            font-weight: 300;
        }

        .input-area .send-btn {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border: none;
            color: #fff;
            padding: 12px 28px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            height: 48px;
            flex-shrink: 0;
            font-family: var(--font);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.2);
        }
        .input-area .send-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.35);
        }
        .input-area .send-btn:active {
            transform: translateY(0) scale(0.98);
        }
        .input-area .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 640px) {
            #chatApp {
                padding: 0;
            }
            .chat-container {
                max-height: 100vh;
                border-radius: 0;
                border: none;
                background: var(--bg-secondary);
            }
            .login-card {
                padding: 32px 24px 28px;
                width: 94%;
                border-radius: 18px;
            }
            .login-card .logo {
                font-size: 36px;
            }
            .login-card h1 {
                font-size: 22px;
            }
            .login-card .subtitle {
                font-size: 13px;
            }
            .slide-content {
                left: 5%;
                bottom: 20%;
                max-width: 90%;
            }
            .slide-content .player-name {
                font-size: 1.8rem;
            }
            .slide-content .player-quote {
                font-size: 0.9rem;
                padding-left: 12px;
            }
            .chat-header {
                padding: 12px 16px;
            }
            .chat-header h1 {
                font-size: 16px;
            }
            .user-controls .username-display,
            .online-count {
                font-size: 11px;
                padding: 2px 10px;
            }
            .messages-area {
                padding: 16px;
            }
            .message {
                max-width: 90%;
                font-size: 14px;
                padding: 8px 14px;
            }
            .input-area {
                padding: 12px 16px 16px;
                gap: 8px;
                flex-wrap: wrap;
            }
            .input-area .input-wrap {
                flex: 1 1 100%;
            }
            .input-area .send-btn {
                width: 100%;
                justify-content: center;
                height: 44px;
                padding: 10px;
            }
            .logout-btn {
                font-size: 11px;
                padding: 2px 10px;
            }
        }

        @media (max-width: 400px) {
            .login-card {
                padding: 24px 16px 20px;
            }
            .login-card .logo {
                font-size: 28px;
            }
            .login-card h1 {
                font-size: 18px;
            }
            .slide-content .player-name {
                font-size: 1.4rem;
            }
            .slide-content .player-quote {
                font-size: 0.75rem;
            }
        }

        /* ---------- UTILITY ---------- */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    LOGIN PAGE
    ============================================================ -->
    <div id="loginPage">
        <!-- Slideshow -->
        <div class="slideshow" id="slideshow"></div>

        <!-- Indicators -->
        <div class="slide-indicators" id="indicators"></div>

        <!-- Login Card -->
        <div class="login-card">
            <span class="logo">⚽</span>
            <h1>Welcome to <span>the Pitch</span></h1>
            <p class="subtitle">Enter the password to join the champions' chat</p>

            <div class="input-group">
                <label for="passwordInput">🔑 Access Code</label>
                <div class="input-wrap">
                    <input
                    type="password"
                    id="passwordInput"
                    placeholder="Enter password…"
                    autocomplete="off"
                    autofocus
                    />
                    <button class="toggle-vis" id="toggleVis" type="button" aria-label="Toggle password visibility">👁️</button>
                </div>
            </div>

            <button class="login-btn" id="loginBtn">
                <span class="spinner"></span>
                <span class="btn-text">🚀 Enter Chat</span>
            </button>

            <div class="error-msg" id="errorMsg">✗ Incorrect password. Try again.</div>

            <div class="login-footer">
                <span>Hint:</span>
                <span class="hint">football2024</span>
            </div>
        </div>
    </div>

    <!-- ============================================================
    CHAT APP
    ============================================================ -->
    <div id="chatApp">
        <div class="chat-container">

            <!-- Header -->
            <header class="chat-header">
                <div class="chat-header-left">
                    <span class="logo">💬</span>
                    <h1>Chat <span>Room</span></h1>
                    <span class="badge">Live</span>
                </div>
                <div class="user-controls">
                    <span class="online-count">
                        <span class="dot"></span>
                        <span id="onlineCount">1</span>
                    </span>
                    <span class="username-display" id="usernameDisplay" title="Click to change">
                        <span id="currentUsername">Guest</span>
                        <span class="edit-icon" id="editUsernameBtn">✎</span>
                    </span>
                    <button class="logout-btn" id="logoutBtn">🚪 Leave</button>
                </div>
            </header>

            <!-- Messages -->
            <div class="messages-area" id="messagesArea">
                <div class="empty-state" id="emptyState">
                    <div class="big-icon">👋</div>
                    <h3>Welcome to the Pitch</h3>
                    <p>Messages appear in real‑time across all connected devices.</p>
                </div>
            </div>

            <!-- Input -->
            <div class="input-area">
                <div class="input-wrap">
                    <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Type a message…"
                    maxlength="500"
                    ></textarea>
                </div>
                <button class="send-btn" id="sendBtn">
                    <span>Send</span>
                    <span>➤</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ---------- CONFIG ----------
            const PASSWORD = 'football2024';
            const STORAGE_KEY = 'chatroom_messages';
            const USERNAME_KEY = 'chatroom_username';
            const CHANNEL_NAME = 'chatroom_channel';

            // ---------- SLIDESHOW DATA (Premium Football Stars) ----------
            const slides = [{
                image: 'https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=1600&q=80',
                name: 'Lionel Messi',
                quote: '“The best decisions aren’t made with your mind, but with your instinct.”'
            }, {
                image: 'https://images.unsplash.com/photo-1459865264687-595d652de67e?w=1600&q=80',
                name: 'Cristiano Ronaldo',
                quote: '“Talent without working hard is nothing.”'
            }, {
                image: 'https://images.unsplash.com/photo-1511882150382-421056c89033?w=1600&q=80',
                name: 'Neymar Jr.',
                quote: '“I want to be one of the best in the world. I work for that every day.”'
            }, {
                image: 'https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=1600&q=80',
                name: 'Kylian Mbappé',
                quote: '“In football, everything is possible. That’s what makes it beautiful.”'
            }, {
                image: 'https://images.unsplash.com/photo-1461896836934-bffe1f7dd1e7?w=1600&q=80',
                name: 'The Beautiful Game',
                quote: '“Football is the only sport where you can express yourself completely.”'
            }];

            let currentSlide = 0;
            let slideInterval = null;

            // ---------- DOM REFS (Login) ----------
            const loginPage = document.getElementById('loginPage');
            const slideshowEl = document.getElementById('slideshow');
            const indicatorsEl = document.getElementById('indicators');
            const passwordInput = document.getElementById('passwordInput');
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const toggleVis = document.getElementById('toggleVis');

            // ---------- DOM REFS (Chat) ----------
            const chatApp = document.getElementById('chatApp');
            const messagesArea = document.getElementById('messagesArea');
            const emptyState = document.getElementById('emptyState');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const currentUsernameSpan = document.getElementById('currentUsername');
            const editUsernameBtn = document.getElementById('editUsernameBtn');
            const onlineCountSpan = document.getElementById('onlineCount');
            const logoutBtn = document.getElementById('logoutBtn');

            // ---------- STATE ----------
            let username = localStorage.getItem(USERNAME_KEY) || 'Guest';
            let messages = [];
            let isSending = false;
            let isLoggedIn = false;
            let typingTimeout = null;
            let isTyping = false;

            // ---------- BroadcastChannel ----------
            let channel = null;
            try {
                channel = new BroadcastChannel(CHANNEL_NAME);
            } catch (_) { /* no-op */ }

            // ============================================================
            // SLIDESHOW
            // ============================================================
            function buildSlideshow() {
                slideshowEl.innerHTML = '';
                indicatorsEl.innerHTML = '';

                slides.forEach((slide, index) => {
                    const slideDiv = document.createElement('div');
                    slideDiv.className = 'slide' + (index === 0 ? ' active' : '');
                    slideDiv.dataset.index = index;

                    const bgDiv = document.createElement('div');
                    bgDiv.className = 'slide-bg';
                    bgDiv.style.backgroundImage = `url(${slide.image})`;
                    slideDiv.appendChild(bgDiv);

                    // Caption inside slide for better visual
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'slide-content';
                    contentDiv.innerHTML = `
                            <div class="player-name">${slide.name}</div>
                            <div class="player-quote">${slide.quote}</div>
                        `;
                    slideDiv.appendChild(contentDiv);

                    slideshowEl.appendChild(slideDiv);

                    // Indicators
                    const dot = document.createElement('span');
                    dot.className = 'dot' + (index === 0 ? ' active' : '');
                    dot.dataset.index = index;
                    indicatorsEl.appendChild(dot);
                });
            }

            function goToSlide(index) {
                const slideEls = slideshowEl.querySelectorAll('.slide');
                const dots = indicatorsEl.querySelectorAll('.dot');

                slideEls.forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                });
                dots.forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                });

                currentSlide = index;
            }

            function nextSlide() {
                const next = (currentSlide + 1) % slides.length;
                goToSlide(next);
            }

            function startSlideshow() {
                if (slideInterval) clearInterval(slideInterval);
                slideInterval = setInterval(nextSlide, 6000);
            }

            // ============================================================
            // LOGIN LOGIC
            // ============================================================
            function attemptLogin() {
                const input = passwordInput.value.trim();
                if (!input) {
                    showError('Please enter the password.');
                    return;
                }

                if (input === PASSWORD) {
                    loginSuccess();
                } else {
                    showError('✗ Incorrect password. Try again.');
                    passwordInput.value = '';
                    passwordInput.focus();
                    // Shake animation
                    const card = loginPage.querySelector('.login-card');
                    card.style.animation = 'none';
                    requestAnimationFrame(() => {
                        card.style.animation = 'card-enter 0.5s ease';
                    });
                }
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.classList.add('show');
                setTimeout(() => {
                    errorMsg.classList.remove('show');
                }, 3000);
            }

            function loginSuccess() {
                isLoggedIn = true;
                loginPage.classList.add('hidden');
                chatApp.classList.add('visible');
                initChat();
                setTimeout(() => messageInput.focus(), 400);
                if (slideInterval) {
                    clearInterval(slideInterval);
                    slideInterval = null;
                }
            }

            // ============================================================
            // CHAT LOGIC
            // ============================================================
            function getTimestamp() {
                return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            }

            function loadMessages() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) {
                            messages = parsed;
                            return;
                        }
                    }
                } catch (_) { /* ignore */ }
                messages = [];
            }

            function saveMessages() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
                } catch (_) { /* ignore */ }
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function renderMessages() {
                const children = messagesArea.children;
                for (let i = children.length - 1; i >= 0; i--) {
                    if (children[i].id !== 'emptyState' && !children[i].classList.contains('typing-indicator')) {
                        children[i].remove();
                    }
                }

                if (messages.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                }

                messages.forEach((msg) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'message-wrapper';

                    if (msg.type === 'system') {
                        wrapper.classList.add('system');
                    } else if (msg.sender === username) {
                        wrapper.classList.add('own');
                    } else {
                        wrapper.classList.add('other');
                    }

                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message';

                    if (msg.type === 'system') {
                        msgDiv.innerHTML = `
                                <span class="msg-text">${escapeHtml(msg.text)}</span>
                            `;
                    } else {
                        msgDiv.innerHTML = `
                                <span class="msg-sender">${escapeHtml(msg.sender)}</span>
                                <span class="msg-text">${escapeHtml(msg.text)}</span>
                                <span class="msg-time">${escapeHtml(msg.time)}</span>
                            `;
                    }

                    wrapper.appendChild(msgDiv);
                    messagesArea.appendChild(wrapper);
                });

                // Keep typing indicator at bottom if present
                const typingEl = messagesArea.querySelector('.typing-indicator');
                if (typingEl) {
                    messagesArea.appendChild(typingEl);
                }

                messagesArea.scrollTop = messagesArea.scrollHeight;
            }

            function addMessage(text, sender, type = 'user') {
                const msg = {
                    id: generateId(),
                    text: text.trim(),
                    sender: sender || 'system',
                    time: getTimestamp(),
                    type: type,
                };
                messages.push(msg);
                saveMessages();
                renderMessages();

                if (channel) {
                    try {
                        channel.postMessage({ type: 'new_message', payload: msg });
                    } catch (_) { /* ignore */ }
                }

                return msg;
            }

            function addSystemMessage(text) {
                addMessage(text, 'system', 'system');
            }

            function sendMessage() {
                const text = messageInput.value.trim();
                if (!text || isSending) return;
                if (text.length > 500) {
                    alert('Message is too long (max 500 characters).');
                    return;
                }

                isSending = true;
                sendBtn.disabled = true;
                addMessage(text, username, 'user');
                messageInput.value = '';
                messageInput.style.height = 'auto';
                messageInput.focus();
                isSending = false;
                sendBtn.disabled = false;
                // Clear typing indicator
                clearTyping();
            }

            function setUsername(newName) {
                const trimmed = newName.trim();
                if (!trimmed) return;
                if (trimmed.length > 30) {
                    alert('Username too long (max 30 characters).');
                    return;
                }
                const oldName = username;
                username = trimmed;
                localStorage.setItem(USERNAME_KEY, username);
                currentUsernameSpan.textContent = username;

                if (channel) {
                    try {
                        channel.postMessage({
                            type: 'username_change',
                            payload: { oldName, newName: username }
                        });
                    } catch (_) { /* ignore */ }
                }

                if (oldName !== username) {
                    addSystemMessage(`${oldName} changed their name to ${username}`);
                }
                renderMessages();
            }

            function promptUsername() {
                const current = username;
                const newName = prompt('Enter your username:', current);
                if (newName !== null && newName.trim() !== '' && newName.trim() !== current) {
                    setUsername(newName.trim());
                }
            }

            // ---------- Typing Indicator ----------
            function showTyping(sender) {
                let typingEl = messagesArea.querySelector('.typing-indicator');
                if (!typingEl) {
                    typingEl = document.createElement('div');
                    typingEl.className = 'typing-indicator';
                    typingEl.innerHTML = `
                            <span>${escapeHtml(sender)} is typing</span>
                            <span class="dots">
                                <span></span><span></span><span></span>
                            </span>
                        `;
                    messagesArea.appendChild(typingEl);
                } else {
                    typingEl.innerHTML = `
                            <span>${escapeHtml(sender)} is typing</span>
                            <span class="dots">
                                <span></span><span></span><span></span>
                            </span>
                        `;
                }
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }

            function hideTyping() {
                const typingEl = messagesArea.querySelector('.typing-indicator');
                if (typingEl) {
                    typingEl.remove();
                }
            }

            function clearTyping() {
                if (typingTimeout) {
                    clearTimeout(typingTimeout);
                    typingTimeout = null;
                }
                hideTyping();
                isTyping = false;
            }

            // ---------- Online count ----------
            const userTimestamps = new Map();
            const TIMEOUT_MS = 6000;

            function updateOnlineCount() {
                onlineCountSpan.textContent = userTimestamps.size || 1;
            }

            function initHeartbeat() {
                const myId = 'tab_' + generateId() + '_' + username;

                function sendHeartbeat() {
                    if (!channel) return;
                    try {
                        channel.postMessage({
                            type: 'heartbeat',
                            payload: { id: myId, username: username, timestamp: Date.now() }
                        });
                    } catch (_) { /* ignore */ }
                }

                if (channel) {
                    channel.addEventListener('message', (e) => {
                        const data = e.data;
                        if (!data || typeof data !== 'object') return;

                        if (data.type === 'heartbeat') {
                            const { id, username: uname, timestamp } = data.payload || {};
                            if (id && uname && timestamp) {
                                userTimestamps.set(id, { username: uname, timestamp });
                                const now = Date.now();
                                let changed = false;
                                for (const [key, val] of userTimestamps) {
                                    if (now - val.timestamp > TIMEOUT_MS) {
                                        userTimestamps.delete(key);
                                        changed = true;
                                    }
                                }
                                if (changed) updateOnlineCount();
                                else updateOnlineCount(); // keep UI fresh
                            }
                        }

                        if (data.type === 'new_message') {
                            const msg = data.payload;
                            if (msg && msg.id) {
                                const exists = messages.some(m => m.id === msg.id);
                                if (!exists) {
                                    messages.push(msg);
                                    saveMessages();
                                    renderMessages();
                                }
                            }
                        }

                        if (data.type === 'username_change') {
                            const { oldName, newName } = data.payload || {};
                            if (oldName && newName) {
                                const lastMsg = messages.length > 0 ? messages[messages.length - 1] : null;
                                const expectedText = `${oldName} changed their name to ${newName}`;
                                if (!lastMsg || lastMsg.text !== expectedText || lastMsg.type !== 'system') {
                                    addSystemMessage(expectedText);
                                }
                            }
                        }

                        if (data.type === 'typing') {
                            const { sender, isTyping: typing } = data.payload || {};
                            if (sender && sender !== username) {
                                if (typing) {
                                    showTyping(sender);
                                } else {
                                    hideTyping();
                                }
                            }
                        }
                    });
                }

                sendHeartbeat();
                setInterval(() => {
                    sendHeartbeat();
                    const now = Date.now();
                    let changed = false;
                    for (const [key, val] of userTimestamps) {
                        if (now - val.timestamp > TIMEOUT_MS) {
                            userTimestamps.delete(key);
                            changed = true;
                        }
                    }
                    if (changed) updateOnlineCount();
                }, 3000);
            }

            // ---------- Logout ----------
            function logout() {
                if (!confirm('Leave the champions chat?')) return;
                isLoggedIn = false;
                chatApp.classList.remove('visible');
                loginPage.classList.remove('hidden');
                passwordInput.value = '';
                passwordInput.focus();
                startSlideshow();
                userTimestamps.clear();
                updateOnlineCount();
                clearTyping();
            }

            // ---------- Init chat ----------
            function initChat() {
                const saved = localStorage.getItem(USERNAME_KEY);
                if (saved) {
                    username = saved;
                }
                currentUsernameSpan.textContent = username;

                loadMessages();
                renderMessages();

                if (messages.length === 0) {
                    addSystemMessage(`👋 Welcome, ${username}! Say hello to the champions.`);
                }

                // Input events
                messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                    setTimeout(() => {
                        messageInput.style.height = 'auto';
                        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
                    }, 0);
                });

                messageInput.addEventListener('input', () => {
                    messageInput.style.height = 'auto';
                    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';

                    // Typing indicator logic
                    if (messageInput.value.length > 0) {
                        if (!isTyping) {
                            isTyping = true;
                            if (channel) {
                                try {
                                    channel.postMessage({
                                        type: 'typing',
                                        payload: { sender: username, isTyping: true }
                                    });
                                } catch (_) { /* ignore */ }
                            }
                        }
                        if (typingTimeout) clearTimeout(typingTimeout);
                        typingTimeout = setTimeout(() => {
                            isTyping = false;
                            if (channel) {
                                try {
                                    channel.postMessage({
                                        type: 'typing',
                                        payload: { sender: username, isTyping: false }
                                    });
                                } catch (_) { /* ignore */ }
                            }
                            hideTyping();
                            typingTimeout = null;
                        }, 1500);
                    } else {
                        clearTyping();
                        if (channel) {
                            try {
                                channel.postMessage({
                                    type: 'typing',
                                    payload: { sender: username, isTyping: false }
                                });
                            } catch (_) { /* ignore */ }
                        }
                    }
                });

                sendBtn.addEventListener('click', sendMessage);

                editUsernameBtn.addEventListener('click', promptUsername);
                currentUsernameSpan.addEventListener('dblclick', promptUsername);

                logoutBtn.addEventListener('click', logout);

                initHeartbeat();
                messageInput.focus();
            }

            // ============================================================
            // EVENT BINDINGS (Login)
            // ============================================================
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    attemptLogin();
                }
            });

            loginBtn.addEventListener('click', attemptLogin);

            toggleVis.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleVis.textContent = type === 'password' ? '👁️' : '🔒';
            });

            // ============================================================
            // INIT
            // ============================================================
            buildSlideshow();
            startSlideshow();
            passwordInput.focus();

            console.log('🏆 Champions Chat · Premium Edition');
            console.log('💡 Password hint: football2024');

            window.__chat = { login: attemptLogin, password: PASSWORD };

        })();
    </script>

</body>
</html>
