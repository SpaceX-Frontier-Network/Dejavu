<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚽ Champions Chat · Password Protected</title>

    <!-- ===== STYLES ===== -->
    <style>
        /* ---------- RESET & BASE ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0e14;
            --bg-secondary: #141a22;
            --bg-card: #1e2630;
            --bg-input: #2a3340;
            --text-primary: #e8edf5;
            --text-secondary: #8b9bb5;
            --text-muted: #5a6a80;
            --accent: #6c8cff;
            --accent-hover: #7f9cff;
            --accent-glow: rgba(108, 140, 255, 0.25);
            --border-color: #2e3a48;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --password: 'football2024';
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* ---------- SCROLLBAR (chat) ---------- */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ============================================================
                   LOGIN / SLIDESHOW PAGE
                   ============================================================ */
        #loginPage {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #loginPage.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ---------- SLIDESHOW BACKGROUND ---------- */
        .slideshow {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: scale(1.05);
            transition: opacity 1.8s ease, transform 8s ease;
            will-change: transform, opacity;
        }

        .slide.active {
            opacity: 1;
            transform: scale(1);
        }

        .slide::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                    rgba(0, 0, 0, 0.70) 0%,
                    rgba(0, 0, 0, 0.40) 50%,
                    rgba(0, 0, 0, 0.70) 100%);
            z-index: 1;
        }

        /* ---------- SLIDE CAPTION ---------- */
        .slide-caption {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 2;
            color: #fff;
            padding: 0 20px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .slide-caption h2 {
            font-size: clamp(1.4rem, 4vw, 3rem);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .slide-caption p {
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);
            opacity: 0.85;
            font-weight: 300;
            letter-spacing: 1px;
            -webkit-text-fill-color: #fff;
        }

        /* ---------- LOGIN CARD ---------- */
        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(20, 26, 34, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px 40px;
            max-width: 440px;
            width: 92%;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            animation: card-enter 0.8s ease;
        }

        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card .logo {
            font-size: 56px;
            margin-bottom: 6px;
            display: block;
        }

        .login-card h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .login-card h1 span {
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-card .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
            letter-spacing: 0.3px;
        }

        .login-card .subtitle i {
            font-style: normal;
            color: var(--text-muted);
        }

        /* password input */
        .input-group {
            position: relative;
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-group .input-wrap {
            display: flex;
            align-items: center;
            background: rgba(42, 51, 64, 0.7);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .input-group .input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 14px 16px;
            font-size: 16px;
            color: var(--text-primary);
            font-family: var(--font);
            letter-spacing: 0.5px;
        }

        .input-group input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .input-group .toggle-vis {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0 16px;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
            line-height: 1;
        }

        .input-group .toggle-vis:hover {
            color: var(--text-secondary);
        }

        /* login button */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6c8cff, #a78bfa);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 140, 255, 0.35);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .login-btn.loading .spinner {
            display: inline-block;
        }
        .login-btn.loading .btn-text {
            opacity: 0.7;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* error message */
        .error-msg {
            color: #fc5c7d;
            font-size: 13px;
            margin-top: 12px;
            min-height: 20px;
            font-weight: 400;
            letter-spacing: 0.3px;
            transition: var(--transition);
            opacity: 0;
            transform: translateY(-4px);
        }

        .error-msg.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* footer hint */
        .login-footer {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 18px;
        }

        .login-footer .hint {
            color: var(--text-secondary);
            background: rgba(108, 140, 255, 0.10);
            padding: 2px 14px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid rgba(108, 140, 255, 0.12);
            display: inline-block;
            letter-spacing: 0.5px;
        }

        /* ---------- SLIDESHOW INDICATORS ---------- */
        .slide-indicators {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 10px;
            pointer-events: none;
        }

        .slide-indicators .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transition: var(--transition);
            pointer-events: none;
        }

        .slide-indicators .dot.active {
            background: #fff;
            width: 28px;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* ============================================================
                   CHAT ROOM (hidden until login)
                   ============================================================ */
        #chatApp {
            display: none;
            height: 100vh;
            width: 100vw;
            background: var(--bg-primary);
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        #chatApp.visible {
            display: flex;
            opacity: 1;
        }

        .chat-container {
            width: 100%;
            max-width: 820px;
            height: 100vh;
            max-height: 100vh;
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: none;
            margin: 0 auto;
        }

        /* ---------- CHAT HEADER ---------- */
        .chat-header {
            padding: 16px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .logo {
            font-size: 22px;
            line-height: 1;
        }

        .chat-header h1 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .chat-header h1 span {
            color: var(--accent);
        }

        .chat-header .badge {
            font-size: 11px;
            background: var(--accent);
            color: #fff;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .user-controls .username-display {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-input);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .user-controls .username-display:hover {
            border-color: var(--accent);
        }

        .user-controls .username-display .edit-icon {
            font-size: 12px;
            opacity: 0.5;
            transition: var(--transition);
        }
        .user-controls .username-display:hover .edit-icon {
            opacity: 1;
        }

        .online-count {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-input);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .online-count .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4cdf8b;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logout-btn:hover {
            background: rgba(252, 92, 125, 0.15);
            border-color: #fc5c7d;
            color: #fc5c7d;
        }

        /* ---------- MESSAGES AREA ---------- */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg-primary);
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            animation: fade-up 0.3s ease;
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            max-width: 78%;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .message .msg-sender {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 2px;
            display: block;
        }

        .message .msg-text {
            display: block;
        }

        .message .msg-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        .message-wrapper.own {
            align-items: flex-end;
        }
        .message-wrapper.own .message {
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message-wrapper.own .message .msg-sender {
            color: rgba(255, 255, 255, 0.8);
        }
        .message-wrapper.own .message .msg-time {
            color: rgba(255, 255, 255, 0.6);
        }

        .message-wrapper.other {
            align-items: flex-start;
        }
        .message-wrapper.other .message {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }
        .message-wrapper.other .message .msg-sender {
            color: var(--accent);
        }

        .message-wrapper.system {
            align-items: center;
        }
        .message-wrapper.system .message {
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 13px;
            padding: 6px 18px;
            border-radius: 20px;
            max-width: 90%;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .message-wrapper.system .message .msg-sender {
            display: none;
        }
        .message-wrapper.system .message .msg-time {
            display: none;
        }

        /* empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
            gap: 8px;
            padding: 20px;
        }
        .empty-state .big-icon {
            font-size: 48px;
            opacity: 0.4;
        }
        .empty-state h3 {
            font-weight: 500;
            color: var(--text-secondary);
        }
        .empty-state p {
            font-size: 14px;
            max-width: 300px;
        }

        /* ---------- INPUT AREA ---------- */
        .input-area {
            padding: 14px 24px 18px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .input-area .input-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .input-area .input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-area textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: var(--font);
            padding: 12px 14px;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            line-height: 1.5;
        }
        .input-area textarea::placeholder {
            color: var(--text-muted);
        }

        .input-area .send-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            height: 48px;
            flex-shrink: 0;
            font-family: var(--font);
        }
        .input-area .send-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .input-area .send-btn:active {
            transform: translateY(0);
        }
        .input-area .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 600px) {
            .login-card {
                padding: 32px 24px 28px;
                width: 94%;
                border-radius: 18px;
            }
            .login-card .logo {
                font-size: 42px;
            }
            .login-card h1 {
                font-size: 22px;
            }
            .login-card .subtitle {
                font-size: 13px;
            }
            .slide-caption h2 {
                font-size: 1.6rem;
            }
            .slide-caption p {
                font-size: 0.9rem;
            }

            .chat-container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
                border: none;
            }
            .chat-header {
                padding: 12px 16px;
            }
            .chat-header h1 {
                font-size: 15px;
            }
            .user-controls .username-display {
                font-size: 12px;
                padding: 2px 10px;
            }
            .online-count {
                font-size: 12px;
                padding: 2px 10px;
            }
            .messages-area {
                padding: 14px 16px;
            }
            .message {
                max-width: 92%;
                font-size: 14px;
                padding: 8px 14px;
            }
            .input-area {
                padding: 10px 16px 14px;
                gap: 8px;
                flex-wrap: wrap;
            }
            .input-area .input-wrap {
                flex: 1 1 100%;
            }
            .input-area .send-btn {
                width: 100%;
                justify-content: center;
                height: 44px;
                padding: 10px;
            }
            .logout-btn {
                font-size: 11px;
                padding: 2px 10px;
            }
        }

        @media (max-width: 400px) {
            .login-card {
                padding: 24px 18px 22px;
            }
            .login-card .logo {
                font-size: 34px;
            }
            .login-card h1 {
                font-size: 19px;
            }
            .slide-caption h2 {
                font-size: 1.2rem;
            }
            .slide-caption p {
                font-size: 0.75rem;
            }
        }

        /* ---------- UTILITY ---------- */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    LOGIN PAGE with Slideshow
    ============================================================ -->
    <div id="loginPage">
        <!-- Slideshow Background -->
        <div class="slideshow" id="slideshow">
            <!-- Slides will be injected by JS -->
        </div>

        <!-- Indicators -->
        <div class="slide-indicators" id="indicators"></div>

        <!-- Slide Caption (dynamic) -->
        <div class="slide-caption" id="slideCaption">
            <h2>⚽ Champions Arena</h2>
            <p>Enter the pitch · Join the conversation</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <span class="logo">🏆</span>
            <h1>Welcome to <span>the Pitch</span></h1>
            <p class="subtitle">Enter the password to join the chat room</p>

            <div class="input-group">
                <label for="passwordInput">🔑 Access Code</label>
                <div class="input-wrap">
                    <input
                    type="password"
                    id="passwordInput"
                    placeholder="Enter password…"
                    autocomplete="off"
                    autofocus
                    />
                    <button class="toggle-vis" id="toggleVis" type="button" aria-label="Toggle password visibility">👁️</button>
                </div>
            </div>

            <button class="login-btn" id="loginBtn">
                <span class="spinner"></span>
                <span class="btn-text">⚡ Enter Chat</span>
            </button>

            <div class="error-msg" id="errorMsg">✗ Incorrect password. Try again.</div>

            <div class="login-footer">
                <span>Hint: </span>
                <span class="hint">football2024</span>
            </div>
        </div>
    </div>

    <!-- ============================================================
    CHAT APP (hidden until login)
    ============================================================ -->
    <div id="chatApp">
        <div class="chat-container">

            <!-- HEADER -->
            <header class="chat-header">
                <div class="chat-header-left">
                    <span class="logo">💬</span>
                    <h1>Chat <span>Room</span></h1>
                    <span class="badge">Live</span>
                </div>
                <div class="user-controls">
                    <span class="online-count">
                        <span class="dot"></span>
                        <span id="onlineCount">1</span>
                    </span>
                    <span class="username-display" id="usernameDisplay" title="Click to change">
                        <span id="currentUsername">Guest</span>
                        <span class="edit-icon" id="editUsernameBtn">✎</span>
                    </span>
                    <button class="logout-btn" id="logoutBtn">🚪 Leave</button>
                </div>
            </header>

            <!-- MESSAGES -->
            <div class="messages-area" id="messagesArea">
                <div class="empty-state" id="emptyState">
                    <div class="big-icon">👋</div>
                    <h3>Welcome to the Chat Room</h3>
                    <p>Messages appear in real‑time across all connected tabs.</p>
                </div>
            </div>

            <!-- INPUT -->
            <div class="input-area">
                <div class="input-wrap">
                    <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Type a message…"
                    maxlength="500"
                    ></textarea>
                </div>
                <button class="send-btn" id="sendBtn">
                    <span>Send</span>
                    <span>➤</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ---------- CONFIG ----------
            const PASSWORD = 'football2024';
            const STORAGE_KEY = 'chatroom_messages';
            const USERNAME_KEY = 'chatroom_username';
            const CHANNEL_NAME = 'chatroom_channel';

            // ---------- SLIDESHOW DATA ----------
            const slides = [{
                image: 'https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=1600&q=80',
                title: '⚡ Legends of the Game',
                subtitle: 'Where champions are made'
            }, {
                image: 'https://images.unsplash.com/photo-1459865264687-595d652de67e?w=1600&q=80',
                title: '🔥 The Beautiful Game',
                subtitle: 'Moments that define history'
            }, {
                image: 'https://images.unsplash.com/photo-1511882150382-421056c89033?w=1600&q=80',
                title: '⭐ Stars on the Field',
                subtitle: 'Passion. Glory. Victory.'
            }, {
                image: 'https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=1600&q=80',
                title: '🏟️ The Cathedral of Football',
                subtitle: 'Where dreams come alive'
            }, {
                image: 'https://images.unsplash.com/photo-1461896836934-bffe1f7dd1e7?w=1600&q=80',
                title: '⚽ One Ball. One Dream.',
                subtitle: 'The world unites on the pitch'
            }];

            let currentSlide = 0;
            let slideInterval = null;

            // ---------- DOM REFS (login) ----------
            const loginPage = document.getElementById('loginPage');
            const slideshowEl = document.getElementById('slideshow');
            const indicatorsEl = document.getElementById('indicators');
            const captionEl = document.getElementById('slideCaption');
            const passwordInput = document.getElementById('passwordInput');
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const toggleVis = document.getElementById('toggleVis');

            // ---------- DOM REFS (chat) ----------
            const chatApp = document.getElementById('chatApp');
            const messagesArea = document.getElementById('messagesArea');
            const emptyState = document.getElementById('emptyState');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const currentUsernameSpan = document.getElementById('currentUsername');
            const editUsernameBtn = document.getElementById('editUsernameBtn');
            const onlineCountSpan = document.getElementById('onlineCount');
            const logoutBtn = document.getElementById('logoutBtn');

            // ---------- STATE ----------
            let username = localStorage.getItem(USERNAME_KEY) || 'Guest';
            let messages = [];
            let isSending = false;
            let isLoggedIn = false;

            // ---------- BroadcastChannel ----------
            let channel = null;
            try {
                channel = new BroadcastChannel(CHANNEL_NAME);
            } catch (_) { /* no-op */ }

            // ============================================================
            // SLIDESHOW
            // ============================================================
            function buildSlideshow() {
                slideshowEl.innerHTML = '';
                indicatorsEl.innerHTML = '';

                slides.forEach((slide, index) => {
                    const div = document.createElement('div');
                    div.className = 'slide' + (index === 0 ? ' active' : '');
                    div.style.backgroundImage = `url(${slide.image})`;
                    div.dataset.index = index;
                    slideshowEl.appendChild(div);

                    const dot = document.createElement('span');
                    dot.className = 'dot' + (index === 0 ? ' active' : '');
                    dot.dataset.index = index;
                    indicatorsEl.appendChild(dot);
                });

                // set initial caption
                updateCaption(0);
            }

            function updateCaption(index) {
                const s = slides[index];
                if (s) {
                    captionEl.innerHTML = `
                            <h2>${s.title}</h2>
                            <p>${s.subtitle}</p>
                        `;
                }
            }

            function goToSlide(index) {
                const slides = slideshowEl.querySelectorAll('.slide');
                const dots = indicatorsEl.querySelectorAll('.dot');

                slides.forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                });
                dots.forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                });

                updateCaption(index);
                currentSlide = index;
            }

            function nextSlide() {
                const next = (currentSlide + 1) % slides.length;
                goToSlide(next);
            }

            function startSlideshow() {
                if (slideInterval) clearInterval(slideInterval);
                slideInterval = setInterval(nextSlide, 5000);
            }

            // ============================================================
            // LOGIN LOGIC
            // ============================================================
            function attemptLogin() {
                const input = passwordInput.value.trim();
                if (!input) {
                    showError('Please enter the password.');
                    return;
                }

                if (input === PASSWORD) {
                    loginSuccess();
                } else {
                    showError('✗ Incorrect password. Try again.');
                    passwordInput.value = '';
                    passwordInput.focus();
                    // shake animation
                    const card = loginPage.querySelector('.login-card');
                    card.style.animation = 'none';
                    requestAnimationFrame(() => {
                        card.style.animation = 'card-enter 0.5s ease';
                    });
                }
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.classList.add('show');
                setTimeout(() => {
                    errorMsg.classList.remove('show');
                }, 3000);
            }

            function loginSuccess() {
                isLoggedIn = true;
                // Hide login, show chat
                loginPage.classList.add('hidden');
                chatApp.classList.add('visible');
                // Init chat
                initChat();
                // Focus input
                setTimeout(() => messageInput.focus(), 400);
                // Stop slideshow
                if (slideInterval) {
                    clearInterval(slideInterval);
                    slideInterval = null;
                }
            }

            // ============================================================
            // CHAT LOGIC
            // ============================================================
            function getTimestamp() {
                return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            }

            function loadMessages() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) {
                            messages = parsed;
                            return;
                        }
                    }
                } catch (_) { /* ignore */ }
                messages = [];
            }

            function saveMessages() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
                } catch (_) { /* ignore */ }
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function renderMessages() {
                const children = messagesArea.children;
                for (let i = children.length - 1; i >= 0; i--) {
                    if (children[i].id !== 'emptyState') {
                        children[i].remove();
                    }
                }

                if (messages.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                messages.forEach((msg) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'message-wrapper';

                    if (msg.type === 'system') {
                        wrapper.classList.add('system');
                    } else if (msg.sender === username) {
                        wrapper.classList.add('own');
                    } else {
                        wrapper.classList.add('other');
                    }

                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message';

                    if (msg.type === 'system') {
                        msgDiv.innerHTML = `
                                <span class="msg-text">${escapeHtml(msg.text)}</span>
                            `;
                    } else {
                        msgDiv.innerHTML = `
                                <span class="msg-sender">${escapeHtml(msg.sender)}</span>
                                <span class="msg-text">${escapeHtml(msg.text)}</span>
                                <span class="msg-time">${escapeHtml(msg.time)}</span>
                            `;
                    }

                    wrapper.appendChild(msgDiv);
                    messagesArea.appendChild(wrapper);
                });

                messagesArea.scrollTop = messagesArea.scrollHeight;
            }

            function addMessage(text, sender, type = 'user') {
                const msg = {
                    id: generateId(),
                    text: text.trim(),
                    sender: sender || 'system',
                    time: getTimestamp(),
                    type: type,
                };
                messages.push(msg);
                saveMessages();
                renderMessages();

                if (channel) {
                    try {
                        channel.postMessage({ type: 'new_message', payload: msg });
                    } catch (_) { /* ignore */ }
                }

                return msg;
            }

            function addSystemMessage(text) {
                addMessage(text, 'system', 'system');
            }

            function sendMessage() {
                const text = messageInput.value.trim();
                if (!text || isSending) return;
                if (text.length > 500) {
                    alert('Message is too long (max 500 characters).');
                    return;
                }

                isSending = true;
                sendBtn.disabled = true;
                addMessage(text, username, 'user');
                messageInput.value = '';
                messageInput.style.height = 'auto';
                messageInput.focus();
                isSending = false;
                sendBtn.disabled = false;
            }

            function setUsername(newName) {
                const trimmed = newName.trim();
                if (!trimmed) return;
                if (trimmed.length > 30) {
                    alert('Username too long (max 30 characters).');
                    return;
                }
                const oldName = username;
                username = trimmed;
                localStorage.setItem(USERNAME_KEY, username);
                currentUsernameSpan.textContent = username;

                if (channel) {
                    try {
                        channel.postMessage({
                            type: 'username_change',
                            payload: { oldName, newName: username }
                        });
                    } catch (_) { /* ignore */ }
                }

                if (oldName !== username) {
                    addSystemMessage(`${oldName} changed their name to ${username}`);
                }
                renderMessages();
            }

            function promptUsername() {
                const current = username;
                const newName = prompt('Enter your username:', current);
                if (newName !== null && newName.trim() !== '' && newName.trim() !== current) {
                    setUsername(newName.trim());
                }
            }

            // ---------- Online count ----------
            const userTimestamps = new Map();
            const TIMEOUT_MS = 6000;

            function updateOnlineCount() {
                onlineCountSpan.textContent = userTimestamps.size || 1;
            }

            function initHeartbeat() {
                const myId = 'tab_' + generateId() + '_' + username;

                function sendHeartbeat() {
                    if (!channel) return;
                    try {
                        channel.postMessage({
                            type: 'heartbeat',
                            payload: { id: myId, username: username, timestamp: Date.now() }
                        });
                    } catch (_) { /* ignore */ }
                }

                if (channel) {
                    channel.addEventListener('message', (e) => {
                        const data = e.data;
                        if (!data || typeof data !== 'object') return;

                        if (data.type === 'heartbeat') {
                            const { id, username: uname, timestamp } = data.payload || {};
                            if (id && uname && timestamp) {
                                userTimestamps.set(id, { username: uname, timestamp });
                                const now = Date.now();
                                let changed = false;
                                for (const [key, val] of userTimestamps) {
                                    if (now - val.timestamp > TIMEOUT_MS) {
                                        userTimestamps.delete(key);
                                        changed = true;
                                    }
                                }
                                if (changed || true) {
                                    updateOnlineCount();
                                } else {
                                    updateOnlineCount();
                                }
                            }
                        }

                        if (data.type === 'new_message') {
                            const msg = data.payload;
                            if (msg && msg.id) {
                                const exists = messages.some(m => m.id === msg.id);
                                if (!exists) {
                                    messages.push(msg);
                                    saveMessages();
                                    renderMessages();
                                }
                            }
                        }

                        if (data.type === 'username_change') {
                            const { oldName, newName } = data.payload || {};
                            if (oldName && newName) {
                                const lastMsg = messages.length > 0 ? messages[messages.length - 1] : null;
                                const expectedText = `${oldName} changed their name to ${newName}`;
                                if (!lastMsg || lastMsg.text !== expectedText || lastMsg.type !== 'system') {
                                    addSystemMessage(expectedText);
                                }
                            }
                        }
                    });
                }

                sendHeartbeat();
                setInterval(() => {
                    sendHeartbeat();
                    const now = Date.now();
                    let changed = false;
                    for (const [key, val] of userTimestamps) {
                        if (now - val.timestamp > TIMEOUT_MS) {
                            userTimestamps.delete(key);
                            changed = true;
                        }
                    }
                    if (changed) {
                        updateOnlineCount();
                    }
                }, 3000);
            }

            // ---------- Logout ----------
            function logout() {
                if (!confirm('Leave the chat room?')) return;
                isLoggedIn = false;
                chatApp.classList.remove('visible');
                loginPage.classList.remove('hidden');
                passwordInput.value = '';
                passwordInput.focus();
                // Restart slideshow
                startSlideshow();
                // Clear online users
                userTimestamps.clear();
                updateOnlineCount();
            }

            // ---------- Init chat ----------
            function initChat() {
                // Load username
                const saved = localStorage.getItem(USERNAME_KEY);
                if (saved) {
                    username = saved;
                }
                currentUsernameSpan.textContent = username;

                loadMessages();
                renderMessages();

                if (messages.length === 0) {
                    addSystemMessage(`👋 Welcome, ${username}! Say hello to everyone.`);
                }

                // Setup input
                messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                    setTimeout(() => {
                        messageInput.style.height = 'auto';
                        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
                    }, 0);
                });

                messageInput.addEventListener('input', () => {
                    messageInput.style.height = 'auto';
                    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
                });

                sendBtn.addEventListener('click', sendMessage);

                editUsernameBtn.addEventListener('click', promptUsername);
                currentUsernameSpan.addEventListener('dblclick', promptUsername);

                logoutBtn.addEventListener('click', logout);

                initHeartbeat();
                messageInput.focus();
            }

            // ============================================================
            // EVENT BINDINGS (login)
            // ============================================================
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    attemptLogin();
                }
            });

            loginBtn.addEventListener('click', attemptLogin);

            toggleVis.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleVis.textContent = type === 'password' ? '👁️' : '🔒';
            });

            // ============================================================
            // INIT
            // ============================================================
            buildSlideshow();
            startSlideshow();
            passwordInput.focus();

            // If already logged in (e.g., from previous session) – but we default to login page
            // Just ensure clean state
            console.log('🏆 Champions Chat · Password protected');
            console.log('💡 Hint: password is "football2024"');

            // Expose for debugging
            window.__chat = { login: attemptLogin, password: PASSWORD };

        })();
    </script>

</body>
</html>
